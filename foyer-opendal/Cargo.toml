[package]
name = "foyer-opendal"
description = "Experimental OpenDAL secondary cache engine for foyer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[features]
default = ["runtime-tokio"]
runtime-tokio = ["foyer/runtime-tokio", "tokio/runtime-tokio"]
runtime-madsim-tokio = [
  "foyer/runtime-madsim-tokio",
  "tokio/runtime-madsim-tokio",
]
test-redis = ["dep:opendal-service-redis"]

[dependencies]
foyer = { workspace = true }
foyer-common = { workspace = true }
foyer-storage = { workspace = true }
futures-util = { workspace = true }
opendal-core = { version = "=0.59.1", default-features = false }
opendal-service-redis = { version = "=0.59.1", optional = true }
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
anyhow = { workspace = true }
opendal-service-fs = { version = "=0.59.1" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
